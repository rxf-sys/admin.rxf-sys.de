# CI for the v2 rebuild (ADR 0009). The legacy ci.yml/cd.yml keep serving main until the switch-over.
# The v2 code is merged into main as well, so its gates run there too; publishing stays v2-only.
name: CI v2

on:
  push:
    branches: [v2, main]
  pull_request:
    branches: [v2, main]

permissions:
  contents: read

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-v2
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-v2
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['26', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-v2
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm test:coverage

  build-size:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-v2
      - run: pnpm build
      - run: pnpm size

  knip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-v2
      - run: pnpm knip

  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-v2
      - run: pnpm --filter @rxf/e2e exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e
      # Desktop and 390 px screenshots, light and dark, as review evidence (brief §3).
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          path: |
            e2e/screenshots/
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Container images (ADR 0009): build both and fail on fixable HIGH/CRITICAL findings.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [server, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.target }}/Dockerfile
          load: true
          tags: rxf-${{ matrix.target }}:ci
          build-args: RXF_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rxf-${{ matrix.target }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml

  # Push to v2 only: images to GHCR, keyless cosign signature bound to this workflow (ADR 0009, option B).
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    needs: [lint, typecheck, test, build-size, knip, osv, e2e, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        target: [server, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.target }}/Dockerfile
          push: true
          tags: |
            ghcr.io/rxf-sys/admin-v2-${{ matrix.target }}:staging
            ghcr.io/rxf-sys/admin-v2-${{ matrix.target }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: RXF_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Signs the digest, not the tag; the LXC verifies this workflow's identity before it pulls.
      - run: cosign sign --yes "ghcr.io/rxf-sys/admin-v2-${TARGET}@${DIGEST}"
        env:
          TARGET: ${{ matrix.target }}
          DIGEST: ${{ steps.build.outputs.digest }}

