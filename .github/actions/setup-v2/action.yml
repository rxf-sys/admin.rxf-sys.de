name: Set up v2 workspace
description: Installs pnpm and Node, then the workspace dependencies from the frozen lockfile.
inputs:
  node-version:
    description: Node major version; defaults to .nvmrc
    required: false
    default: ''
runs:
  using: composite
  steps:
    # pnpm version comes from "packageManager" in package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
